

<nav class="bg-brand-600 text-white p-2 shadow-md relative" id="navbar">
  <div class="container mx-auto flex justify-between items-center">
    <a href="/" class="font-bold text-3xl hover:bg-brand-500 p-1 rounded-lg transition duration-300 ease-in-out">Snehulak</a>

    <!-- Hamburger tlačítko (zobrazené jen na mobilech md:hidden) -->
    <button type="button" id="menu-toggle" class="md:hidden text-white text-2xl bg-transparent border-none cursor-pointer p-2 focus:outline-none" aria-label="Toggle menu">
      <span class="hamburger-icon">&#9776;</span>
      <span class="close-icon hidden">&times;</span>
    </button>

    <!-- Odkazy (na mobilu výchozí hidden, po rozkliknutí flex) -->
    <div id="nav-links" class="hidden md:flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-4 absolute md:relative top-full left-0 w-full md:w-auto bg-brand-600 md:bg-transparent p-4 md:p-0 shadow-md md:shadow-none z-50">
      <ul class="flex flex-col md:flex-row space-y-1 md:space-y-0 space-x-0 md:space-x-1 w-full md:w-auto">

        <li><a href="{{ link(lang ~ "/") }}" class="block text-center hover:bg-brand-500 p-3 rounded-lg transition duration-300 ease-in-out">
          Home
        </a></li>
        <li><a href="{{ link(lang ~ "/about_me/") }}" class="block text-center hover:bg-brand-500 p-3 rounded-lg transition duration-300 ease-in-out">
          About me
        </a></li>

        {% for lang_ver in page.trans %}
          {% if lang_ver.lang != page.lang %}
            <li><a href="{{ link(lang_ver.path) }}" class="block text-center hover:bg-brand-500 p-3 rounded-lg transition duration-300 ease-in-out">
              {{ lang_ver.lang | upper }}
            </a></li>
          {% endif %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
