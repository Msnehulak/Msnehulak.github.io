<!DOCTYPE html>
<html lang="{{ page.lang if page else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page.title }} - {{ SITENAME }}{% endblock %}</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <div class="logo">SnehulakTV</div>
        <div class="odkazy">
            {% set lang_prefix = '/cz' if page and page.lang == 'cs' else '' %}
            <a href="{{ lang_prefix }}/index.html">Home</a>
            <a href="{{ lang_prefix }}/projects.html">Projects</a>
            <a href="{{ lang_prefix }}/osu.html">My Osu</a>
            
            {% if page and page.lang == 'en' %}
                <a href="/cz/{{ page.slug }}.html" class="lang-switch">CZ</a>
            {% elif page %}
                <a href="/{{ page.slug }}.html" class="lang-switch">EN</a>
            {% endif %}
        </div>
    </nav>

    <main>
        <section class="karta">
            {% block content %}{{ page.content }}{% endblock %}
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SnehulakTV</p>
    </footer>
</body>
</html>
