name: Deploy Web & Redirects

on:
  push:
    branches:
      - 'my-engine'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'bash/**'
      - '.env.example'
      - '.lighthouserc.json'
      - '.github/.FUNDING.yml'
      - '.gitignore'
      - '.gitattributes'
#   schedule:
#     - cron: '0 0 * * *'
#   workflow_dispatch:
#     inputs:
#       is_production:
#         description: 'Nasadit do PRODUKCE?'
#         required: true
#         type: boolean
#         default: false 

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Cache cache/ folder 
        id: cache-custom
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-custom-${{ hashFiles('config.json') }}
          restore-keys: |
            ${{ runner.os }}-custom-

      - name: Install Python dependencies
        run: |
          uv venv
          .venv/bin/uv pip install .

      - name: Install Node dependencies
        run: npm install

#       - name: Determine Environment
#         id: env-spec
#         run: |

      - name: Build Web Site
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STEAM_API: ${{ secrets.STEAM_API }}
          SITEURL: "" 
        run: |
          .venv/bin/python build.py


      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ./output --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=my-engine

         
