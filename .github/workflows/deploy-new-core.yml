name: Deploy Web & Redirects

on:
  push:
    branches: ['my-engine']
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'bash/**'
      - '.env.example'
      - '.lighthouserc.json'
      - '.github/.FUNDING.yml'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write
  pages: write

concurrency:
  group: "pages"               # ← chybělo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Python ---
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.14.0"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"   # ← správná syntaxe

      - name: Install Python dependencies
        run: uv sync --locked

      # --- Node ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # --- Cache dat z buildu (YouTube API, stažené thumbnaily) ---
      - name: Cache cache/ folder
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-custom-${{ hashFiles('data/socials.yaml', 'uv.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-custom-

      # --- Build ---
      - name: Build Web Site
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STEAM_API: ${{ secrets.STEAM_API }}
          SITEURL: "https://snehulak.dev"   # ← reálná doména, nebo úplně vynech
        run: uv run python build.py

      # --- Deploy ---
      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ./output \
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} \
            --branch=my-engine        
