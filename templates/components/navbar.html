

<nav class="bg-brand text-white p-2 shadow-md">
  <div class="container mx-auto flex justify-between items-center">
    <a href="{{ '/'|url }}" class="font-bold text-3xl hover:bg-sky-800 p-1 rounded-lg transition duration-300 ease-in-out">Snehulak</a>

    <div class="flex items-center space-x-4">
      <ul class="flex space-x-1">
        <li><a href="{{ '/'|url }}"
               class="hover:bg-sky-800 p-3 rounded-lg transition duration-300 ease-in-out">
          {% if this.alt == 'cs' %}Domů{% else %}Home{% endif %}
        </a></li>
        <li><a href="{{ '/about'|url }}"
               class="hover:bg-sky-800 p-3 rounded-lg transition duration-300 ease-in-out">
          {% if this.alt == 'cs' %}O mně{% else %}About me{% endif %}
        </a></li>
      </ul>

      <div class="relative inline-block">
        <button
          type="button"
          onclick="this.nextElementSibling.classList.toggle('hidden')"
          class="hover:bg-sky-800 p-2 rounded-lg transition duration-300 ease-in-out"
        >
          {% if this.alt == 'cs' %}jazyk{% else %}lang{% endif %}
        </button>

        <ul class="hidden absolute mt-2 bg-brand rounded-md shadow-lg py-2">
          {% for lang in get_alts(this) %}
            {% set translated_page = site.get(this._path, alt=lang) %}
            <li>
              <a
                href="{{ translated_page | url(alt=lang) }}"
                class="block px-5 py-2 text-sm hover:bg-sky-800 transition text-center"
              >
                {{ lang }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</nav>
